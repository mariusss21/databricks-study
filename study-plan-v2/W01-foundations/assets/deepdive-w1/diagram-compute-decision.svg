<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Compute decision flow"><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#1b1f2a}
.muted{fill:#5b6476}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.box{fill:#f0f2f8;stroke:#dde1ea;stroke-width:1.5}.boxA{fill:#fff0ed;stroke:#ff3621;stroke-width:1.5}
.boxI{fill:#e9f1ff;stroke:#1f5fbf;stroke-width:1.5}.boxO{fill:#e5f6ee;stroke:#11845b;stroke-width:1.5}
.boxW{fill:#fff6dd;stroke:#9a6700;stroke-width:1.5}.boxB{fill:#fdecee;stroke:#c62f3a;stroke-width:1.5}
.ln{stroke:#5b6476;stroke-width:1.6;fill:none}.lnA{stroke:#ff3621;stroke-width:2;fill:none}.lnO{stroke:#11845b;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}.fA{fill:#ff3621}.fO{fill:#11845b}.fB{fill:#c62f3a}.fI{fill:#1f5fbf}.fW{fill:#9a6700}
</style><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fI"/></marker></defs>
    <rect x="10" y="20" width="250" height="70" rx="10" class="box"/>
    <text x="135" y="48" font-size="13" font-weight="700" text-anchor="middle">Pure SQL for BI / dashboards,</text>
    <text x="135" y="66" font-size="13" font-weight="700" text-anchor="middle">many concurrent users?</text>
    <rect x="330" y="20" width="250" height="70" rx="10" class="boxO"/>
    <text x="455" y="48" font-size="14" font-weight="700" text-anchor="middle">SQL warehouse</text>
    <text x="455" y="68" font-size="12" text-anchor="middle">(serverless preferred) · size ≠ max clusters</text>
    <line x1="260" y1="55" x2="328" y2="55" class="ln" marker-end="url(#ar2)"/><text x="294" y="48" font-size="12" text-anchor="middle" class="fO" font-weight="700">yes</text>
    <line x1="135" y1="90" x2="135" y2="128" class="ln" marker-end="url(#ar2)"/><text x="150" y="114" font-size="12" class="fB" font-weight="700">no</text>
    <rect x="10" y="130" width="250" height="118" rx="10" class="box"/>
    <text x="135" y="152" font-size="13" font-weight="700" text-anchor="middle">Needs something you configure</text>
    <text x="135" y="170" font-size="13" font-weight="700" text-anchor="middle">on the compute itself?</text>
    <text x="135" y="192" font-size="11.5" text-anchor="middle">init script · most Spark confs · RDD API</text>
    <text x="135" y="208" font-size="11.5" text-anchor="middle">instance pool · compute policy · GPU type</text>
    <text x="135" y="224" font-size="11.5" text-anchor="middle">compute-scoped libraries · runs &gt; 7 days</text>
    <line x1="260" y1="170" x2="328" y2="170" class="ln" marker-end="url(#ar2)"/><text x="294" y="163" font-size="12" text-anchor="middle" class="fO" font-weight="700">yes</text>
    <rect x="330" y="130" width="250" height="80" rx="10" class="boxW"/>
    <text x="455" y="156" font-size="14" font-weight="700" text-anchor="middle">Classic compute</text>
    <text x="455" y="176" font-size="12" text-anchor="middle">scheduled → jobs compute</text>
    <text x="455" y="194" font-size="12" text-anchor="middle">interactive → all-purpose</text>
    <line x1="135" y1="248" x2="135" y2="262" class="ln"/><line x1="135" y1="262" x2="650" y2="262" class="ln"/><line x1="650" y1="262" x2="650" y2="212" class="ln" marker-end="url(#ar2)"/>
    <text x="300" y="257" font-size="12" class="fB" font-weight="700">no</text>
    <rect x="610" y="130" width="380" height="80" rx="10" class="boxA"/>
    <text x="800" y="156" font-size="14" font-weight="700" text-anchor="middle">Serverless (the default)</text>
    <text x="800" y="176" font-size="12" text-anchor="middle">notebook → serverless notebook compute</text>
    <text x="800" y="194" font-size="12" text-anchor="middle">scheduled → serverless job · Python deps via %pip / environment</text>
    <rect x="610" y="20" width="380" height="70" rx="10" class="box"/>
    <text x="800" y="44" font-size="12" text-anchor="middle" class="muted">The axis is configurability,</text>
    <text x="800" y="62" font-size="12" text-anchor="middle" class="muted">not Python vs SQL. Python and SQL run everywhere</text>
    <text x="800" y="80" font-size="12" text-anchor="middle" class="muted">except the SQL warehouse (SQL only).</text>
  </svg>